services:
  # CPU-only deployment (default).
  # Benchmarked at ~16x real-time on 12 cores, within ~25% of the CUDA path on
  # long audio and faster on short clips: the int8 ONNX export falls back to CPU
  # for most of the encoder anyway. CPU also leaves the GPUs free for other work.
  parakeet-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: parakeet-tdt:cpu
    container_name: parakeet-cpu
    ports:
      - "5092:5092"
    volumes:
      - parakeet-models:/app/models
    environment:
      - INFERENCE_DEVICE=cpu
      - PARAKEET_MODEL=nemo-parakeet-tdt-0.6b-v2  # English-only; drop for the multilingual v3
      - PARAKEET_QUANTIZATION=none  # fp32: same CPU speed as int8 here, ~2 GB more RAM
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5092/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # GPU deployment. Opt-in only: `docker compose --profile gpu up -d parakeet-gpu`
  # (stop parakeet-cpu first, they share port 5092).
  # Needs the NVIDIA Container Toolkit, and needs enough free VRAM on the pinned
  # card: sharing it with a large LLM will OOM mid-transcription.
  parakeet-gpu:
    profiles: [ "gpu" ]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: parakeet-tdt:gpu
    container_name: parakeet-gpu
    ports:
      - "5092:5092"
    volumes:
      - parakeet-models:/app/models
    environment:
      - INFERENCE_DEVICE=gpu
      - PARAKEET_MODEL=nemo-parakeet-tdt-0.6b-v2
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ "1" ]  # Quadro RTX 4000
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5092/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  parakeet-models:
    name: parakeet-models
